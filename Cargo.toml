[workspace]
members = ["cirond", "cironctl", "ciron-common"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Zaptoss"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.100"
config = "0.15.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
shell-words = "1.1"

# gRPC dependencies
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
